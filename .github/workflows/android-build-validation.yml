name: Android build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
      - 'fastlane/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-foss-apk:
    name: Build FOSS APK (unsigned)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
          cache: gradle

      - name: Select the FOSS build configuration
        run: sed -i 's/^isFullBuild=.*/isFullBuild=false/' gradle.properties

      - name: Assemble release APKs
        run: ./gradlew --no-daemon :androidApp:assembleRelease

      - name: Save unsigned APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unx-music-foss-apks
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

name: Bug report
description: Report a reproducible problem in UnX Music.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "2.6.27"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version and device
      placeholder: "Android 16, device model"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that consistently trigger the problem.
      placeholder: "1. Open… 2. Tap… 3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove passwords, cookies, tokens, and personal data before sharing.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing report.
          required: true
        - label: I removed private information from attached logs and screenshots.
          required: true
